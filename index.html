<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新春好運刮刮卡雨</title>
    <style>
        :root {
            --gold: #ffca28;
            --red: #b71c1c;
        }
        body {
            margin: 0;
            background: var(--red);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Microsoft JhengHei", sans-serif;
            color: var(--gold);
            overflow: hidden;
            touch-action: manipulation;
            height: 100vh;
        }

        h1 { margin-top: 20px; text-shadow: 2px 2px 4px #000; z-index: 100; }
        .instructions { color: #fff; margin-bottom: 10px; z-index: 100; }

        /* 掉落畫面層 */
        #selection-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
        }

        .falling-card {
            position: absolute;
            width: 80px;
            height: 110px;
            background: #d32f2f;
            border: 2px solid var(--gold);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            animation: fall linear forwards;
        }

        @keyframes fall {
            from { transform: translateY(-120px) rotate(0deg); }
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* 刮獎遊戲層 */
        #game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 200;
            margin-top: 20px;
        }

        #container {
            position: relative;
            width: 300px;
            height: 450px;
            background: #fff;
            border: 8px solid var(--gold);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #prize-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff9c4;
        }

        .prize-text { font-size: 24px; color: #d32f2f; font-weight: bold; }
        .prize-amount { font-size: 52px; color: #d32f2f; margin: 10px 0; }

        #scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
            touch-action: none;
        }

        .btn-group { margin-top: 20px; }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background: var(--gold);
            color: var(--red);
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 0 #c79100;
        }
    </style>
</head>
<body>

    <h1>🧧 新春刮刮雨</h1>
    
    <div id="selection-screen">
        <p class="instructions" style="text-align: center; margin-top: 80px;">點擊一張掉落中的卡片！</p>
    </div>

    <div id="game-area">
        <p class="instructions">刮開領取你的好運獎金！</p>
        <div id="container">
            <div id="prize-layer">
                <div class="prize-text">恭喜獲得</div>
                <div id="display-amount" class="prize-amount">$0</div>
                <div style="font-size: 14px; color: #777;">財源廣進 · 萬事如意</div>
            </div>
            <canvas id="scratch-canvas" width="300" height="450"></canvas>
        </div>
        <div class="btn-group">
            <button onclick="resetToSelection()">重新挑戰</button>
        </div>
    </div>

    <script>
        const selectionScreen = document.getElementById('selection-screen');
        const gameArea = document.getElementById('game-area');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const displayAmount = document.getElementById('display-amount');
        
        let isDrawing = false;
        let spawnInterval;
        const prizes = [200, 666, 888]; // 你的指定獎項

        // 開始掉落卡片
        function startFalling() {
            spawnInterval = setInterval(() => {
                const card = document.createElement('div');
                card.className = 'falling-card';
                card.innerHTML = '🧧';
                card.style.left = Math.random() * (window.innerWidth - 80) + 'px';
                
                const duration = Math.random() * 2 + 3; // 3-5秒掉完
                card.style.animationDuration = duration + 's';

                // 點擊事件
                card.onclick = () => pickCard(card);
                card.ontouchstart = (e) => {
                    e.preventDefault();
                    pickCard(card);
                };

                selectionScreen.appendChild(card);

                // 超出畫面移除
                setTimeout(() => {
                    if(card.parentNode) card.remove();
                }, duration * 1000);
            }, 600);
        }

        // 選中卡片
        function pickCard(card) {
            clearInterval(spawnInterval);
            
            // 隨機選一個獎項
            const winAmount = prizes[Math.floor(Math.random() * prizes.length)];
            displayAmount.innerText = `$${winAmount}`;

            // 畫面轉換
            selectionScreen.style.display = 'none';
            // 清除畫面上所有殘留卡片
            selectionScreen.querySelectorAll('.falling-card').forEach(c => c.remove());
            
            gameArea.style.display = 'flex';
            initCanvas();
        }

        function initCanvas() {
            canvas.style.opacity = '1';
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#9e9e9e';
            ctx.font = 'bold 30px Microsoft JhengHei';
            ctx.textAlign = 'center';
            ctx.fillText('刮開看驚喜', 150, 225);
        }

        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // 刮開超過 50% 自動揭曉
            checkPercent();
        }

        function checkPercent() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let cleared = 0;
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i + 3] === 0) cleared++;
            }
            if (cleared > (imageData.data.length / 4) * 0.5) {
                canvas.style.transition = 'opacity 0.8s';
                canvas.style.opacity = '0';
            }
        }

        function resetToSelection() {
            gameArea.style.display = 'none';
            selectionScreen.style.display = 'block';
            startFalling();
        }

        // 事件監聽
        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

        // 初始化開始
        startFalling();
    </script>
</body>
</html>
