<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>錢，給我錢</title>
    <style>
        :root {
            --gold: #f9d423;
            --money-green: #4caf50;
        }
        body {
            margin: 0;
            background: radial-gradient(circle, #8e0e00 0%, #1f0505 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: var(--gold);
            overflow: hidden;
            touch-action: manipulation;
            height: 100vh; /* 滿版高度 */
            padding-bottom: env(safe-area-inset-bottom); /* iPhone 安全區域 */
        }

        /* 標題：錢，給我錢 */
        h1 { 
            margin-top: 5vh; /* 使用相對高度，確保不同手機比例一致 */
            margin-bottom: 10px;
            font-size: clamp(32px, 10vw, 45px); /* 自動縮放字體 */
            font-weight: 900;
            text-align: center;
            background: linear-gradient(to bottom, #fff 0%, var(--gold) 50%, #ff5b00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.8));
            animation: shake 0.5s infinite alternate;
            z-index: 100;
        }

        @keyframes shake {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .instructions { 
            color: #fff; 
            margin-bottom: 5px; 
            font-size: 14px;
            font-weight: bold; 
            text-shadow: 1px 1px 5px #000; 
            z-index: 100;
        }

        #selection-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* 掉落物比例微調 */
        .falling-card {
            position: absolute;
            width: 70px; /* 從 85 縮小到 70 */
            height: 90px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: 2px solid #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            cursor: pointer;
            animation: fall linear forwards;
        }

        @keyframes fall {
            from { transform: translateY(-120px) rotate(0deg); }
            to { transform: translateY(110vh) rotate(360deg); }
        }

        #game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 200;
            width: 100%;
        }

        /* 縮小容器比例，確保手機完整顯示 */
        #container {
            position: relative;
            width: 280px;  /* 從 320 縮小 */
            height: 400px; /* 從 480 縮小 */
            background: rgba(0, 0, 0, 0.5);
            border: 5px solid var(--gold);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }

        #prize-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #fff 0%, #fbc02d 100%);
        }

        .prize-text { font-size: 20px; color: #d32f2f; font-weight: 900; }
        .prize-amount { font-size: 56px; color: #1b5e20; margin: 10px 0; font-weight: 900; }

        #scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }

        button {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 18px;
            background: linear-gradient(to bottom, #4caf50 0%, #1b5e20 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <h1>錢，給我錢</h1>
    
    <div id="selection-screen">
        <p class="instructions" style="text-align: center; margin-top: 130px;">快抓住飛過去的財富！</p>
    </div>

    <div id="game-area">
        <p class="instructions">用力刮開，把錢拿走！</p>
        <div id="container">
            <div id="prize-layer">
                <div class="prize-text">這份賞給你的</div>
                <div id="display-amount" class="prize-amount">$0</div>
                <div style="font-size: 16px; color: #1b5e20; font-weight: 900;">恭喜發財 ‧ 錢滾錢</div>
            </div>
            <canvas id="scratch-canvas" width="280" height="400"></canvas>
        </div>
        <button onclick="resetToSelection()">我要更多錢！</button>
    </div>

    <script>
        const selectionScreen = document.getElementById('selection-screen');
        const gameArea = document.getElementById('game-area');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const displayAmount = document.getElementById('display-amount');
        
        let isDrawing = false;
        let spawnInterval;
        // 依照要求設定獎項
        const prizes = [200, 666, 888];
        const emojis = ['💰', '💵', '💎', '🤑'];

        function startFalling() {
            spawnInterval = setInterval(() => {
                const card = document.createElement('div');
                card.className = 'falling-card';
                card.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                card.style.left = Math.random() * (window.innerWidth - 75) + 'px';
                const duration = Math.random() * 1.5 + 2; 
                card.style.animationDuration = duration + 's';

                card.onclick = () => pickCard(card);
                card.ontouchstart = (e) => { e.preventDefault(); pickCard(card); };

                selectionScreen.appendChild(card);
                setTimeout(() => { if(card.parentNode) card.remove(); }, duration * 1000);
            }, 500);
        }

        function pickCard(card) {
            clearInterval(spawnInterval);
            const winAmount = prizes[Math.floor(Math.random() * prizes.length)];
            displayAmount.innerText = `$${winAmount}`;
            selectionScreen.style.display = 'none';
            selectionScreen.querySelectorAll('.falling-card').forEach(c => c.remove());
            gameArea.style.display = 'flex';
            initCanvas();
        }

        function initCanvas() {
            canvas.style.opacity = '1';
            ctx.globalCompositeOperation = 'source-over';
            
            const grad = ctx.createLinearGradient(0, 0, 280, 400);
            grad.addColorStop(0, '#ffd700');
            grad.addColorStop(0.5, '#fff7ad');
            grad.addColorStop(1, '#ff8c00');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#8e0e00';
            ctx.font = 'bold 24px Microsoft JhengHei';
            ctx.textAlign = 'center';
            ctx.fillText('別客氣，刮！', 140, 200);
        }

        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2);
            ctx.fill();
            checkPercent();
        }

        function checkPercent() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let cleared = 0;
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i + 3] === 0) cleared++;
            }
            if (cleared > (imageData.data.length / 4) * 0.4) {
                canvas.style.transition = 'opacity 0.6s';
                canvas.style.opacity = '0';
            }
        }

        function resetToSelection() {
            gameArea.style.display = 'none';
            selectionScreen.style.display = 'block';
            startFalling();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

        startFalling();
    </script>
</body>
</html>
