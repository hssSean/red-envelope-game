<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新春六選一刮刮樂</title>
    <style>
        :root {
            --gold: #ffca28;
            --red: #b71c1c;
        }
        body {
            margin: 0;
            background: var(--red);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Microsoft JhengHei", sans-serif;
            color: var(--gold);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        h1 { margin-top: 20px; text-shadow: 2px 2px 4px #000; }
        .sub-title { color: #fff; margin-bottom: 20px; }

        /* 選擇畫面 */
        #selection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 10px;
            max-width: 350px;
        }

        .card-option {
            width: 150px;
            height: 200px;
            background: #d32f2f;
            border: 4px solid var(--gold);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card-option:active { transform: scale(0.95); }

        /* 遊戲畫面 */
        #game-area {
            display: none; /* 預設隱藏 */
            flex-direction: column;
            align-items: center;
        }

        #container {
            position: relative;
            width: 300px;
            height: 450px;
            background: #fff;
            border: 8px solid var(--gold);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #prize-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff9c4;
        }

        .prize-text { font-size: 24px; color: #d32f2f; font-weight: bold; }
        .prize-amount { font-size: 52px; color: #d32f2f; margin: 10px 0; }

        #scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
            touch-action: none;
        }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background: var(--gold);
            color: var(--red);
            border: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🧧 新春好運刮刮樂</h1>
    
    <div id="selection-screen">
        <p class="sub-title">請挑選一張紅包，看你的手氣！</p>
        <div id="selection-grid">
            <div class="card-option" onclick="pickCard(0)">🧧</div>
            <div class="card-option" onclick="pickCard(1)">🧧</div>
            <div class="card-option" onclick="pickCard(2)">🧧</div>
            <div class="card-option" onclick="pickCard(3)">🧧</div>
            <div class="card-option" onclick="pickCard(4)">🧧</div>
            <div class="card-option" onclick="pickCard(5)">🧧</div>
        </div>
    </div>

    <div id="game-area">
        <p class="sub-title">動動手指，刮開大獎！</p>
        <div id="container">
            <div id="prize-layer">
                <div class="prize-text">恭喜獲得</div>
                <div id="display-amount" class="prize-amount">$0</div>
                <div style="font-size: 14px; color: #777;">財源廣進 · 萬事如意</div>
            </div>
            <canvas id="scratch-canvas" width="300" height="450"></canvas>
        </div>
        <div class="btn-group">
            <button onclick="backToMenu()">回首頁</button>
        </div>
    </div>

    <script>
        const selectionScreen = document.getElementById('selection-screen');
        const gameArea = document.getElementById('game-area');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const displayAmount = document.getElementById('display-amount');

        // 定義獎項池：200*2, 666*2, 888*2
        let prizes = [200, 200, 666, 666, 888, 888];
        let isDrawing = false;

        // 洗牌算法
        function shuffle() {
            for (let i = prizes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [prizes[i], prizes[j]] = [prizes[j], prizes[i]];
            }
        }

        // 選擇卡片
        function pickCard(index) {
            shuffle(); // 每次點擊都重新隨機分配
            const result = prizes[index];
            displayAmount.innerText = `$${result}`;
            
            selectionScreen.style.display = 'none';
            gameArea.style.display = 'flex';
            initCanvas();
        }

        // 初始化畫布
        function initCanvas() {
            canvas.style.opacity = '1';
            ctx.globalCompositeOperation = 'source-over';
            
            // 繪製銀色塗層
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 裝飾
            ctx.fillStyle = '#9e9e9e';
            ctx.font = 'bold 30px Microsoft JhengHei';
            ctx.textAlign = 'center';
            ctx.fillText('刮開看好運', 150, 225);
        }

        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fill();
            
            checkPercent();
        }

        function checkPercent() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let cleared = 0;
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i + 3] === 0) cleared++;
            }
            if (cleared > (imageData.data.length / 4) * 0.5) {
                canvas.style.transition = 'opacity 0.8s';
                canvas.style.opacity = '0';
            }
        }

        function backToMenu() {
            gameArea.style.display = 'none';
            selectionScreen.style.display = 'flex';
        }

        // 事件監聽
        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

    </script>
</body>
</html>
